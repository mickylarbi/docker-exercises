services:
  my-java-app:
    depends_on:
      mysql:
        condition: service_healthy
    image: 13.140.189.182:8083/my-app:2.0
    container_name: my-java-app
    ports:
      - "8080:8080"
    environment:
      DB_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
      DB_PWD: ${DB_PWD}
      DB_SERVER: ${DB_SERVER}
    networks:
      - db-network
  mysql:
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PWD}
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - db-network

  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_HOST: mysql
    ports:
      - "8081:80"
    networks:
      - db-network



volumes:
  mysql_data:

networks:
  db-network: